<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OXO Game</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#e94560" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OXO" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="container">
    <h1>OXO</h1>

    <!-- Mode Selector -->
    <div class="mode-selector">
      <button class="mode-btn active" id="btn-pvp" data-mode="pvp">
        👥 <span>2 Players</span>
      </button>

      <button class="mode-btn" id="btn-pvc" data-mode="pvc">
        🤖 <span>vs Computer</span>
      </button>
    </div>

    <!-- Difficulty (only shown in PvC mode) -->
    <div class="difficulty-row" id="difficulty-row" style="display:none">
      <label>Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy 🟢</option>
        <option value="medium">Medium 🟡</option>
        <option value="hard" selected>Hard 🔴</option>
      </select>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box player-x">
        <span class="score-label" id="label-x">Player X</span>
        <span class="score-value" id="score-x">0</span>
      </div>

      <div class="score-box draws">
        <span class="score-label">Draws</span>
        <span class="score-value" id="score-draw">0</span>
      </div>

      <div class="score-box player-o">
        <span class="score-label" id="label-o">Player O</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <!-- Board -->
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="btn-row">
      <button class="btn" id="restart-btn">New Game</button>
      <button class="btn secondary" id="reset-scores-btn">
        Reset Scores
      </button>
    </div>

    <!-- PWA Install Button -->
    <button class="install-app-btn" id="installAppBtn" >
      📲 Install OXO App
    </button>
  </div>

  <!-- Result Overlay -->
  <div class="overlay" id="overlay">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-text" id="result-text"></div>
      <button class="btn" id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script src="./game.js"></script>

  <!-- PWA / Service Worker / Install -->
  <script>
  let deferredInstallPrompt = null;

  const installAppBtn = document.getElementById("installAppBtn");

  // Register Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js")
        .then(() => {
          console.log("OXO Service Worker registered successfully.");
        })
        .catch((error) => {
          console.error("Service Worker registration failed:", error);
        });
    });
  }

  // Browser says OXO can be installed
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();

    deferredInstallPrompt = event;

    console.log("OXO installation prompt available.");
  });

  // Install button
  installAppBtn.addEventListener("click", async () => {

    // Native installation prompt available
    if (deferredInstallPrompt) {

      deferredInstallPrompt.prompt();

      const result = await deferredInstallPrompt.userChoice;

      console.log("OXO installation result:", result.outcome);

      deferredInstallPrompt = null;

      return;
    }

    // Native prompt unavailable
    alert(
      "Install OXO Game\n\n" +
      "Chrome / Edge:\n" +
      "Open the browser menu (⋮) and choose " +
      "'Install OXO Game' or 'Install page as app'.\n\n" +
      "On mobile:\n" +
      "Use 'Add to Home Screen' or 'Install app'."
    );
  });

  // App successfully installed
  window.addEventListener("appinstalled", () => {
    console.log("OXO Game installed successfully.");

    deferredInstallPrompt = null;

    installAppBtn.style.display = "none";
  });

  // If already running as an installed app,
  // don't show the install button.
  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  if (isStandalone) {
    installAppBtn.style.display = "none";
  }
</script>
