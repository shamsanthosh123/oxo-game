<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OXO Game</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e94560" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OXO" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>OXO</h1>

    <!-- Mode Selector -->
    <div class="mode-selector">
      <button class="mode-btn active" id="btn-pvp" data-mode="pvp">
        👥 <span>2 Players</span>
      </button>
      <button class="mode-btn" id="btn-pvc" data-mode="pvc">
        🤖 <span>vs Computer</span>
      </button>
    </div>

    <!-- Difficulty (only shown in PvC mode) -->
    <div class="difficulty-row" id="difficulty-row" style="display:none">
      <label>Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy 🟢</option>
        <option value="medium">Medium 🟡</option>
        <option value="hard" selected>Hard 🔴</option>
      </select>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-box player-x">
        <span class="score-label" id="label-x">Player X</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score-box draws">
        <span class="score-label">Draws</span>
        <span class="score-value" id="score-draw">0</span>
      </div>
      <div class="score-box player-o">
        <span class="score-label" id="label-o">Player O</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <!-- Board -->
    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="btn-row">
      <button class="btn" id="restart-btn">New Game</button>
      <button class="btn secondary" id="reset-scores-btn">Reset Scores</button>
    </div>
  </div>

  <!-- Result Overlay -->
  <div class="overlay" id="overlay">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-text" id="result-text"></div>
      <button class="btn" id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
